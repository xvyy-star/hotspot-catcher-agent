name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'config/**'
      - 'alembic.ini'
      - 'pytest.ini'
      - '.env.example'
      - '*.ps1'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'config/**'
      - 'alembic.ini'
      - 'pytest.ini'
      - '.env.example'
      - '*.ps1'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql+pymysql://hotspot_ci:ci_test_password@127.0.0.1:3306/hotspot_agent_ci?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/1
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: hotspot_ci_${{ github.run_id }}_${{ github.run_attempt }}
      API_AUTH_ENABLED: 'true'
      ADMIN_USERNAME: admin
      ADMIN_TOKEN: ci-admin-token
      APP_SECRET_KEY: ci-app-secret-key-for-tests-only
      SCHEDULER_ENABLED: 'false'
      AUTO_CREATE_TABLES: 'false'
      DOCS_ENABLED: 'false'
      TRUSTED_PROXY_COUNT: '0'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: hotspot_agent_ci
          MYSQL_USER: hotspot_ci
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      qdrant:
        image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
        ports:
          - 6333:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Wait for Qdrant
        shell: bash
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request

          endpoint = os.environ["QDRANT_URL"].rstrip("/") + "/"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(endpoint, timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Qdrant did not become ready within 60 seconds")
          PY

      - name: Compile backend
        run: python -m compileall -q backend/app scripts

      - name: Prepare database and apply migrations
        run: python scripts/prepare_database.py

      - name: Check Alembic schema alignment
        run: |
          python -m alembic -c alembic.ini current
          python -m alembic -c alembic.ini check

      - name: Run complete backend test suite
        run: python -m pytest backend/tests -q

      - name: Run deterministic AI quality gate
        run: python scripts/evaluate_ai_quality.py

      - name: Upload AI quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ai-quality-${{ github.run_attempt }}
          path: reports/ai_quality_latest.json
          if-no-files-found: ignore
          retention-days: 14
