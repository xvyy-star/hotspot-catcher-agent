name: AI Quality Gate

on:
  push:
    paths:
      - 'backend/app/evaluation/**'
      - 'backend/app/pipeline/**'
      - 'backend/app/schemas.py'
      - 'backend/tests/fixtures/ai_quality_baseline.json'
      - 'backend/tests/test_ai_quality_eval.py'
      - 'backend/tests/test_pipeline.py'
      - 'scripts/evaluate_ai_quality.py'
      - 'backend/requirements.txt'
      - '.github/workflows/ai-quality.yml'
  pull_request:
    paths:
      - 'backend/app/evaluation/**'
      - 'backend/app/pipeline/**'
      - 'backend/app/schemas.py'
      - 'backend/tests/fixtures/ai_quality_baseline.json'
      - 'backend/tests/test_ai_quality_eval.py'
      - 'backend/tests/test_pipeline.py'
      - 'scripts/evaluate_ai_quality.py'
      - 'backend/requirements.txt'
      - '.github/workflows/ai-quality.yml'
  workflow_dispatch:

concurrency:
  group: ai-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run deterministic AI quality gate
        run: python scripts/evaluate_ai_quality.py

      - name: Run quality and pipeline regression tests
        run: python -m pytest backend/tests/test_ai_quality_eval.py backend/tests/test_pipeline.py --noconftest -q

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-quality-${{ github.run_attempt }}
          path: reports/ai_quality_latest.json
          if-no-files-found: error
          retention-days: 30
